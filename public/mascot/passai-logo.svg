<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep dark purple rounded square -->
  <rect width="512" height="512" rx="105" fill="#0D0C24"/>

  <!-- Left ear triangle (behind/same layer as face) -->
  <polygon points="152,228 180,110 228,168" fill="#7872E8"/>
  <!-- Right ear triangle -->
  <polygon points="284,168 332,110 360,228" fill="#7872E8"/>

  <!-- Cat head circle -->
  <circle cx="256" cy="275" r="120" fill="#7872E8"/>

  <!-- Inner left ear (dark cutout to show depth) -->
  <polygon points="168,218 184,140 216,176" fill="#1A1840"/>
  <!-- Inner right ear -->
  <polygon points="296,176 328,140 344,218" fill="#1A1840"/>

  <!-- Left eye (dark oval) -->
  <ellipse cx="216" cy="265" rx="20" ry="23" fill="#0D0C24"/>
  <!-- Right eye -->
  <ellipse cx="296" cy="265" rx="20" ry="23" fill="#0D0C24"/>

  <!-- Eye shine dots (tiny purple highlights) -->
  <circle cx="223" cy="257" r="7" fill="#7872E8"/>
  <circle cx="303" cy="257" r="7" fill="#7872E8"/>

  <!-- Nose: small inverted triangle -->
  <path d="M 248 296 L 256 310 L 264 296 Z" fill="#0D0C24"/>

  <!-- Mouth: gentle W-curve below nose -->
  <path d="M 239 318 Q 248 326 256 322 Q 264 326 273 318"
        stroke="#0D0C24" stroke-width="7" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Whisker lines (left side) -->
  <line x1="136" y1="282" x2="213" y2="290" stroke="#0D0C24" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="136" y1="302" x2="213" y2="300" stroke="#0D0C24" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Whisker lines (right side) -->
  <line x1="299" y1="290" x2="376" y2="282" stroke="#0D0C24" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="299" y1="300" x2="376" y2="302" stroke="#0D0C24" stroke-width="5.5" stroke-linecap="round"/>
</svg>
